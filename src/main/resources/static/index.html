<!doctype html><html lang="sv"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Manager</title><link rel="stylesheet" href="/style.css"></head><body><main><header><p class="eyebrow">TASK MANAGER</p><h1>Få saker gjorda.</h1><p>En enkel task manager byggd med Java och Spring Boot.</p></header><section class="card"><h2>Ny uppgift</h2><form id="taskForm"><input id="title" placeholder="Vad behöver göras?" required><textarea id="description" placeholder="Beskrivning"></textarea><select id="priority"><option value="LOW">Låg prioritet</option><option value="MEDIUM" selected>Medel prioritet</option><option value="HIGH">Hög prioritet</option></select><input id="deadline" type="date"><button>Skapa uppgift</button></form></section><section class="tasks"><div class="heading"><h2>Mina uppgifter</h2><select id="filter"><option value="ALL">Alla</option><option value="TODO">Att göra</option><option value="IN_PROGRESS">Pågår</option><option value="DONE">Klart</option></select></div><div id="taskList"></div></section></main><script src="/app.js"></script></body></html>
